version: '3.8'

networks:
  ai-mesh-network:
    name: ai-mesh-network
    driver: bridge

services:
  # ----------------------------------------------------
  # 1. LOCAL INFERENCE SERVER (Your Optimized vLLM Container)
  # ----------------------------------------------------
  Cloud-vllm:
    image: vllm/vllm-openai:latest
    container_name: Cloud-vllm
    networks:
      - ai-mesh-network
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - VLLM_USE_V2_MODEL_RUNNER=0
    ports:
      - "8000:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      --model Qwen/Qwen2.5-Coder-7B-Instruct-AWQ
      --port 8000
      --max-model-len 1024
      --gpu-memory-utilization 0.70
      --max-num-seqs 1
      --enforce-eager
      --distributed-executor-backend mp

  # ----------------------------------------------------
  # 2. EVENT GATEWAY (Apache Kafka Stream Broker)
  # ----------------------------------------------------
  Cloud-kafka:
    image: apache/kafka:latest
    container_name: Cloud-kafka
    networks:
      - ai-mesh-network
    ports:
      - "9092:9092" 
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@Cloud-kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://Cloud-kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_LOG_DIRS=/tmp/kraft-combined-logs
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1

  # ----------------------------------------------------
  # 3. VECTOR STORAGE & CACHE ENGINE (Qdrant Rust Server)
  # ----------------------------------------------------
  Cloud-qdrant:
    image: qdrant/qdrant:latest
    container_name: Cloud-qdrant
    networks:
      - ai-mesh-network
    ports:
      - "6333:6333" 
      - "6334:6334" 
    volumes:
      - qdrant_storage:/qdrant/storage

  # ----------------------------------------------------
  # 4. EDGE VISUAL SIMULATOR (Streamlit Dashboard Interface)
  # ----------------------------------------------------
  Edge-sensor:
    image: python:3.11-slim
    container_name: Edge-sensor
    networks:
      - ai-mesh-network
    ports:
      - "8501:8501"
    volumes:
      - ./edge:/app
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir streamlit pandas paho-mqtt && 
             streamlit run sensor.py 
             --server.port=8501 
             --server.address=0.0.0.0 
             --server.enableCORS=false 
             --server.enableXsrfProtection=false"

  # ----------------------------------------------------
  # 5. LIGHTWEIGHT EDGE MESSAGE BUS (MQTT Mosquitto Broker)
  # ----------------------------------------------------
  Edge-mqtt-broker:
    image: eclipse-mosquitto:latest
    container_name: Edge-mqtt-broker
    networks:
      - ai-mesh-network
    ports:
      - "1883:1883"
    entrypoint: >
      sh -c "mkdir -p /mosquitto/config && 
             echo 'listener 1883 0.0.0.0\nallow_anonymous true' > /mosquitto/config/mosquitto.conf && 
             exec mosquitto -c /mosquitto/config/mosquitto.conf"

  # ----------------------------------------------------
  # 6. EDGE GATEWAY SERVICE (Decoupled TFLite Anomaly Processor)
  # ----------------------------------------------------
  Edge-anomaly-detector:
    image: python:3.11-slim
    container_name: Edge-anomaly-detector
    networks:
      - ai-mesh-network
    volumes:
      - ./edge:/app:ro
      - ./artifacts:/artifacts:ro
    working_dir: /app
    # 🔥 FIXED: Corrected index URL path back to Google Coral package directory endpoint
    command: sh -c "pip install --no-cache-dir --extra-index-url https://github.io \"numpy<2\" paho-mqtt kafka-python tflite_runtime && python -u anomaly_detector.py"

# Persistent storage configuration block
volumes:
  qdrant_storage:
